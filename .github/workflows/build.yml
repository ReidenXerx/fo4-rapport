# Build Rapport.dll in public, and publish its hash.
#
# WHY THIS EXISTS. The plugin is a binary, and "how do I know this DLL is not
# malware" is a fair question that no amount of argument answers. Source being
# public is necessary and not sufficient: nobody can tell by looking whether the
# DLL on the Nexus page was built from it.
#
# This makes that checkable. Every push builds the plugin on a clean
# GitHub-hosted runner from the public source, prints the SHA256 into the job
# summary, and uploads the DLL as an artifact. Anyone can hash the file they
# downloaded and compare it to a build log they did not control and cannot edit.
#
# It is configured to match the local release build exactly - same generator,
# same triplet, same pinned vcpkg baseline - because a CI build that differs
# from the shipped build proves nothing about the shipped build.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout (with CommonLibF4)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Before the build, because they take a second and the build takes ten
      # minutes. A registry that would hand out new FormIDs, or a bark table the
      # plugin reads that no longer matches the bank, both ship silently wrong
      # lines: the correct subtitle over the wrong audio, or a Topic id the ESP
      # does not have.
      - name: Voice ids and bark table are current
        shell: pwsh
        run: |
          python scripts/formids.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/build-barks-table.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Pin vcpkg to the baseline
        shell: pwsh
        run: |
          # The runner ships vcpkg SHALLOW and at HEAD. Two separate problems:
          #
          #   shallow  -> the pinned baseline commit is not in its history, so
          #               every dependency fails to resolve at all.
          #   at HEAD  -> the ports tree is newer than the pinned version
          #               database, so a port carries a version the baseline has
          #               never heard of (rapidcsv 9.07 against a database that
          #               stops at 8.99).
          #
          # Deepening fixes the first and not the second. Checking the whole tree
          # out AT the baseline fixes both, and is what the pin is FOR: the point
          # is to build against the same library versions every time, so the hash
          # this workflow publishes can actually be reproduced.
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (Test-Path "$vcpkg/.git/shallow") {
            git -C $vcpkg fetch --unshallow --quiet
          } else {
            git -C $vcpkg fetch --quiet origin
          }
          git -C $vcpkg -c advice.detachedHead=false checkout --quiet --detach "386d7c478221b7ee0c97bfe6ea61dcf65121d564"
          if ($LASTEXITCODE -ne 0) { throw 'could not check out baseline 386d7c478221b7ee0c97bfe6ea61dcf65121d564' }
          & "$vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed at the baseline' }
          Write-Host "vcpkg pinned to $(git -C $vcpkg rev-parse --short HEAD)"

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Hash the plugin
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse build -Filter Rapport.dll |
                 Where-Object { $_.FullName -notmatch 'CommonLibF4' } |
                 Select-Object -First 1
          if (-not $dll) { throw 'no Rapport.dll was produced' }
          $h = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Rapport.dll  $($dll.Length) bytes  sha256 $h"
          # Built as an ARRAY, not a here-string: a PowerShell here-string needs
          # its content at column 0, and column 0 terminates a YAML block scalar.
          # That mismatch is what made the first version of this file unparseable.
          $md = @(
            '## Rapport.dll',
            '',
            '| | |',
            '| --- | --- |',
            "| **SHA256** | $h |",
            "| size | $($dll.Length) bytes |",
            "| commit | ${{ github.sha }} |",
            '',
            'Built on a clean GitHub-hosted runner from the source in this commit.',
            'Hash the file you downloaded and compare:',
            '',
            '    Get-FileHash .\Rapport.dll -Algorithm SHA256'
          )
          $md -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-dll-${{ github.sha }}
          path: build/Release/Rapport.dll
          if-no-files-found: error
