; Rapport - read once when the game's data is ready.
; Changing a value needs a restart; nothing here is re-read during play.

[Scheduler]
; How often the framework looks at the world, in seconds. Range 10-30.
TickSeconds = 20

; Dead time after a load before the first tick, in seconds. The first minute
; after a load is when the script engine is busiest, so we stay out of it.
WarmupSeconds = 60

; Budget for one slice of work on the main thread, in milliseconds.
; A pass is split across as many frames as it needs to stay under this.
FrameBudgetMs = 0.25

; How far around the player actors are considered, in game units.
ScanRadius = 4096

; How many scenes the framework may have running at once.
MaxConcurrentScenes = 1

; How often the Papyrus bridge asks whether there is a scene to start, in
; seconds. Almost every ask returns nothing; this is a doorbell, not a scan.
PollSeconds = 3

; How long a scene runs, in seconds.
SceneSeconds = 30

; How long after a scene an actor is left alone, in GAME hours. This belongs to
; the stand-in behaviour, not to the framework: the save records WHEN a scene
; happened and takes no view on what counts as too soon. 0 disables it.
CooldownHours = 24

; How long an actor AAF has refused as busy is passed over, in seconds. AAF's
; busy flag is cleared by a scene ending, so an actor left flagged by something
; that never became a scene would otherwise be offered on every tick forever.
; 0 disables the backoff.
BusyBackoffSeconds = 300

; How long the bridge must have been listening to AAF's scene events before it
; will call a busy flag STALE and take it off.
;
; AAF_ActorBusy is a keyword AAF stamps and only AAF clears -- the engine knows
; nothing about it. A scene that dies before it finishes leaves it on forever,
; saved into the save, and that actor is refused by every AAF mod from then on.
; Rapport now removes such a flag, but only when NO scene is running anywhere,
; and only after listening long enough that a scene begun before we connected
; could not still be going.
;
; 0 disables it: never touch a flag we did not set.
StaleFlagGraceSeconds = 120

; Freeze the face against everything else while an expression is on.
;
; What contends with a Rapport expression is not the animation pack -- the whole
; install has ten mfgSet references and the pack playing here has one -- it is the
; ENGINE's own facial idle, which writes the same morphs to blink, breathe and
; talk. Two writers on one morph is the flicker.
;
; AAF's AddMFGBlock is the one lever never pulled; Rapport only ever REMOVED
; blocks, on clear. UNPROVEN: RemoveMFGBlock is known to release a lock="true"
; morph, which says block and lock are the same mechanism, and lock demonstrably
; did not win the jaw. So this may do nothing at all.
;
; If it DOES work, a blocked face cannot blink or talk for the length of the
; scene. During sex that is arguably right. Set 0 to turn it off and compare.
BlockAnimationFaces = 1



; With DryRun on, the framework watches and reports and starts nothing. This is
; the default: a fresh install should never surprise anyone. Set it to 0 to let
; it act.
DryRun = 0

; The scenario the stand-in asks for. Rapport itself never chooses a scenario --
; an addon does -- and the scheduler only picks one because it is standing in for
; the Chemistry addon until that exists. Both go away together.
;
; Named in Data/F4SE/Plugins/Rapport/scenarios.json. Empty runs a plain scene.
StandInScenario = athome

; NOT a scene length, and not a model of how scenes end. An EMERGENCY STOP.
;
; A scene runs for as long as its author made it: a tree walks its own authored
; stages and leaves through its own Finish branch, and cutting that short is
; exactly how the climax was being lost -- the ending is the last thing to
; happen, so an imposed clock is guaranteed to be the thing that takes it.
;
; What ends a scene with NO tree is honestly not known. One ended itself at 290.8s
; with nothing here firing, six seconds off the duration AAF had been handed --
; either AAF honours that duration or the staged animation simply ran out of
; stages, and one scene cannot tell those apart. So this does not try to be clever
; about it. Its only job is that two actors are never left flagged busy in AAF for
; the rest of the save.
;
; 600 is chosen against the installed content, not picked round: the longest tree
; here declares 265s, and at the worst ratio measured between declared and actual
; (1.89x) that is about 501s. Nothing in the catalogue comes near 600. If a pack
; ships a genuinely longer scene, raise this -- the log prints the number when it
; trips, so you will know that is what happened.
MaxSceneSeconds = 600


[Safety]
; Drop an actor's record once nothing has happened to them for this many GAME
; hours and they have no overlay standing. A 200-hour playthrough would
; otherwise carry every settler who ever walked past anyone. 0 keeps everything.
PruneHours = 720

; The way out. Set this to 1 and load a save: every overlay Rapport applied is
; taken back off, every face it set is cleared, and the ledger is emptied. It
; says so in the log and reminds you to set it back to 0.
;
; It exists because an overlay this mod applied must never be something only
; this mod can remove -- including after you uninstall it, which is why you run
; this BEFORE uninstalling rather than after.
PanicClear = 0

[AAF]
; AAF stops answering and nothing tells you.
;
; It re-initialises on Actor.OnPlayerLoadGame, and the last thing that
; initialisation does is call into a Scaleform menu -- which on a load screen, or
; on the second of two loads in quick succession, is not there to take the call.
; AAF then sits "not ready" for the rest of the session: scenes are accepted, no
; error comes back, and nothing ever happens.
;
; So Rapport watches, and calls AAF's own EveryTime_Initialization again. That is
; the same function AAF runs on every load and runs again itself when the
; LooksMenu closes -- not something bolted on from outside.

; How long AAF gets to come back on its own first. A normal load has it answering
; within a couple of seconds; this is generous because restarting a framework
; that was merely slow is worse than waiting for it.
; 60, not 15: status 1 is also plain "still booting", and re-initialising a
; healthy AAF before 1.7.8 loads a second interface (double events, double scenes).
; AAF's author, fo4-rapport issue #1 §1.
AAFReviveGraceSeconds = 60

; Between restarts. The restart is asynchronous -- AAF is ready when its own
; interface announces itself, whenever that is -- so asking again sooner proves
; nothing and risks two initialisations overlapping.
AAFReviveRetrySeconds = 12

; How many restarts before giving up and saying so in the log. 0 turns the
; watchdog off entirely and restores the old behaviour: report, and refuse.
;
; Never done while a scene is running. A scene that is running is proof AAF was
; working when it started, and restarting its interface is exactly what would
; end it.
AAFReviveAttempts = 3

; Drive facial expressions at all.
;
; Every set Rapport ships locks its morphs -- jaw open at 100, brows and cheeks
; at 100 -- and so does every one of the 131 sets the installed packs ship. The
; engine's own facial idle writes those same morphs to blink, breathe and talk,
; and two writers on a locked morph contend continuously, even though Rapport
; applies a set only about ten times in a whole scene.
;
; Set this to 0 if faces flicker. It is also the way to find out whose fault it
; is: with expressions off, anything still glitching is not Rapport.
DriveFaces = 1

[Debug]
; Ask AAF what it matches for each tag a stage tries, plus one unfiltered query
; per stage as a baseline. Logged raw as OnAnimationQueryResult.
;
; OFF now, because the question it was added for is ANSWERED: every tagged query
; came back 0 -- including PenisToVagina, which 2320 installed positions carry --
; while the unfiltered one came back non-zero. So the query works and AAF's tag
; matching does not, and ChangePosition, which those numbers were gathered to
; explain, is gone.
;
; Turn it back on when a DIFFERENT install has a gap worth diagnosing: it is the
; only probe that separates "the packs do not have this" from "AAF cannot match
; it". It costs one or two of the eight orders a poll can carry, on every stage.
DiagnoseStageTags = 0

; Extra logging. Off by default.
Verbose = 1

; ---- the dev command channel ----------------------------------------------
; Both OFF, and they are two flags rather than one level on purpose: a channel
; that reports what the plugin thinks and a channel that runs arbitrary console
; commands are different decisions, and nobody should make the second by
; accident while making the first.
;
; With DevMailbox=1 the plugin watches Documents\My Games\Fallout4\F4SE\
; Rapport.cmd, runs one verb per line on the main thread, and appends the answers
; to Rapport.cmd.out. Anything that can write that file can drive this game, so
; the plugin says so at error level on every launch it is on.
;
; Verbs: ping, health, stranded, heal, who <formid>, say <text>, console <cmd>
DevMailbox=0
DevConsole=0
