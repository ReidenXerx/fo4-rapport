; Rapport's AAF settings overlay. AAF merges settings files by priority, so this
; changes nothing in the AAF install itself and can be deleted at any time.
;
; Development only: it turns on AAF's own logging so a refused scene says why,
; in .../My Games/Fallout4/Logs/Script/User/. Ship with these off.

priority                = 100

[DEBUG MODES]
debug_to_papyrus_log    = true
troubleshooting_level   = 0    ; 0 on purpose: this controls POP-UPS during play,
                               ; not the log. Setting it to 2 put AAF warnings on screen and made
                               ; the owner click OK through content problems that were never ours.
