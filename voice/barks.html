 "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Best offer you'll get all week, and it expires in about a minute.", "n": "03"}, {"id": "mercantile_quickie_init_04", "p": "mercantile", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "I'll owe you for this. You know I'm good for it.", "n": "04"}, {"id": "mercantile_quickie_init_05", "p": "mercantile", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Quick trade, and you won't regret the terms.", "n": "05"}, {"id": "mercantile_quickie_init_06", "p": "mercantile", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Everything here costs something. This is what I give away free.", "n": "06"}, {"id": "mercantile_quickie_resp_01", "p": "mercantile", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "Then you'd better make it worth the price.", "n": "01"}, {"id": "mercantile_quickie_resp_02", "p": "mercantile", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "I'll take that deal. Hurry up and close it.", "n": "02"}, {"id": "mercantile_quickie_resp_03", "p": "mercantile", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "You're good for it. Go on, then.", "n": "03"}, {"id": "mercantile_quickie_resp_04", "p": "mercantile", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "Terms accepted, so stop talking about them.", "n": "04"}, {"id": "mercantile_quickie_resp_05", "p": "mercantile", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "I want that in caps later. Right now just come here.", "n": "05"}, {"id": "mercantile_quickie_resp_06", "p": "mercantile", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "Cheap at twice the cost. Move.", "n": "06"}, {"id": "mercantile_athome_init_01", "p": "mercantile", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "Door's locked and the whole day is paid for. Come and collect.", "n": "01"}, {"id": "mercantile_athome_init_02", "p": "mercantile", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "I saved this one back for you. Everything else went on the counter.", "n": "02"}, {"id": "mercantile_athome_init_03", "p": "mercantile", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "I've been putting something aside all week, and it turns out it's you.", "n": "03"}, {"id": "mercantile_athome_init_04", "p": "mercantile", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "Whatever this costs me, I decided a while ago it was worth it.", "n": "04"}, {"id": "mercantile_athome_init_05", "p": "mercantile", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "Nobody's buying and nobody's selling tonight. There's only us.", "n": "05"}, {"id": "mercantile_athome_init_06", "p": "mercantile", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "Take as long as you like. I'm not charging by the hour.", "n": "06"}, {"id": "mercantile_athome_resp_01", "p": "mercantile", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "Then I'm going to take my time with you.", "n": "01"}, {"id": "mercantile_athome_resp_02", "p": "mercantile", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "You always did know what a thing was worth.", "n": "02"}, {"id": "mercantile_athome_resp_03", "p": "mercantile", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "Keep that offer open all night and I'll keep saying yes.", "n": "03"}, {"id": "mercantile_athome_resp_04", "p": "mercantile", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "That's the first honest deal I've been offered in months.", "n": "04"}, {"id": "mercantile_athome_resp_05", "p": "mercantile", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "I'd have paid double for this. Don't tell anybody.", "n": "05"}, {"id": "mercantile_athome_resp_06", "p": "mercantile", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "Come here and collect, then.", "n": "06"}, {"id": "mercantile_tender_init_01", "p": "mercantile", "k": "pair", "s": "tender", "r": "initiator", "a": "", "t": "Out here nothing costs anything, and that's why I like it.", "n": "01"}, {"id": "mercantile_tender_init_02", "p": "mercantile", "k": "pair", "s": "tender", "r": "initiator", "a": "", "t": "I'd trade the whole stash for another hour of this.", "n": "02"}, {"id": "mercantile_tender_init_03", "p": "mercantile", "k": "pair", "s": "tender", "r": "initiator", "a": "", "t": "You're the only thing out here I'd call valuable.", "n": "03"}, {"id": "mercantile_tender_init_04", "p": "mercantile", "k": "pair", "s": "tender", "r": "initiator", "a": "", "t": "No caps and no counting tonight. Just stay a while.", "n": "04"}, {"id": "mercantile_tender_init_05", "p": "mercantile", "k": "pair", "s": "tender", "r": "initiator", "a": "", "t": "I've got nothing to offer you except this, and I'm offering it.", "n": "05"}, {"id": "mercantile_tender_init_06", "p": "mercantile", "k": "pair", "s": "tender", "r": "initiator", "a": "", "t": "Everything I own looks like junk next to you.", "n": "06"}, {"id": "mercantile_tender_resp_01", "p": "mercantile", "k": "pair", "s": "tender", "r": "responder", "a": "", "t": "Then keep it all. This is the part I wanted.", "n": "01"}, {"id": "mercantile_tender_resp_02", "p": "mercantile", "k": "pair", "s": "tender", "r": "responder", "a": "", "t": "You've got nothing left to trade and I'm still standing here.", "n": "02"}, {"id": "mercantile_tender_resp_03", "p": "mercantile", "k": "pair", "s": "tender", "r": "responder", "a": "", "t": "That's worth more than anything in your pack.", "n": "03"}, {"id": "mercantile_tender_resp_04", "p": "mercantile", "k": "pair", "s": "tender", "r": "responder", "a": "", "t": "I'd take this over caps on any day you care to name.", "n": "04"}, {"id": "mercantile_tender_resp_05", "p": "mercantile", "k": "pair", "s": "tender", "r": "responder", "a": "", "t": "Don't offer me anything. Just stay.", "n": "05"}, {"id": "mercantile_tender_resp_06", "p": "mercantile", "k": "pair", "s": "tender", "r": "responder", "a": "", "t": "Come closer. That's the whole price.", "n": "06"}, {"id": "romantic_quickie_init_01", "p": "romantic", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "I wanted to do this properly. I'll settle for doing it now.", "n": "01"}, {"id": "romantic_quickie_init_02", "p": "romantic", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "This deserves candles and a locked door, and it's getting neither.", "n": "02"}, {"id": "romantic_quickie_init_03", "p": "romantic", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Forgive the hurry. I've been thinking about you since morning.", "n": "03"}, {"id": "romantic_quickie_init_04", "p": "romantic", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Not how I pictured it, but it's still you, so it'll do.", "n": "04"}, {"id": "romantic_quickie_init_05", "p": "romantic", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "I'd make a speech about it if there were time, and there isn't.", "n": "05"}, {"id": "romantic_quickie_init_06", "p": "romantic", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Come here before the whole moment gets away from us.", "n": "06"}, {"id": "romantic_quickie_resp_01", "p": "romantic", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "Save the speech for later and come here now.", "n": "01"}, {"id": "romantic_quickie_resp_02", "p": "romantic", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "The moment is enough on its own. Take it.", "n": "02"}, {"id": "romantic_quickie_resp_03", "p": "romantic", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "You always wanted it perfect. This is better than perfect.", "n": "03"}, {"id": "romantic_quickie_resp_04", "p": "romantic", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "I don't need the candles. I need you.", "n": "04"}, {"id": "romantic_quickie_resp_05", "p": "romantic", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "Then be quick about it, and still be sweet.", "n": "05"}, {"id": "romantic_quickie_resp_06", "p": "romantic", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "Hurry up, and mean every second of it.", "n": "06"}, {"id": "romantic_athome_init_01", "p": "romantic", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "The door is shut and the whole evening belongs to the two of us.", "n": "01"}, {"id": "romantic_athome_init_02", "p": "romantic", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "I've thought about this every single night this week.", "n": "02"}, {"id": "romantic_athome_init_03", "p": "romantic", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "Let me look at you properly for once, without anybody watching.", "n": "03"}, {"id": "romantic_athome_init_04", "p": "romantic", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "There is nowhere I would rather be than in this room with you.", "n": "04"}, {"id": "romantic_athome_init_05", "p": "romantic", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "Stay tonight, and let the rest of the world get on without us.", "n": "05"}, {"id": "romantic_athome_init_06", "p": "romantic", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "You make this ruin feel like somewhere worth living in.", "n": "06"}, {"id": "romantic_athome_resp_01", "p": "romantic", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "Then don't waste a minute of it on talking.", "n": "01"}, {"id": "romantic_athome_resp_02", "p": "romantic", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "I've thought about it too, every night, exactly the same.", "n": "02"}, {"id": "romantic_athome_resp_03", "p": "romantic", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "Look all you like. I'm not going anywhere tonight.", "n": "03"}, {"id": "romantic_athome_resp_04", "p": "romantic", "k": "pa id": "mercantile_observer_alone_05", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "alone", "t": "That is the most anybody has given away free around here all week.", "n": "05"}, {"id": "mercantile_observer_alone_06", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Everything in this place has a price. Apparently not that.", "n": "06"}, {"id": "mercantile_observer_alone_07", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "alone", "t": "There ought to be a tax on that, and I would collect it.", "n": "07"}, {"id": "mercantile_observer_alone_08", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Free entertainment. Hard to argue with those margins.", "n": "08"}, {"id": "mercantile_observer_crowd_01", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Somebody should be selling tickets to this.", "n": "01"}, {"id": "mercantile_observer_crowd_02", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Caps say they do not make it as far as the bed.", "n": "02"}, {"id": "mercantile_observer_crowd_03", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "If I had a stall right here I would retire by morning.", "n": "03"}, {"id": "mercantile_observer_crowd_04", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Admission is free today, apparently. Terrible business.", "n": "04"}, {"id": "mercantile_observer_crowd_05", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Taking bets, anyone? I rather like the odds.", "n": "05"}, {"id": "mercantile_observer_crowd_06", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "This crowd would pay. Somebody is leaving caps on the table.", "n": "06"}, {"id": "mercantile_observer_crowd_07", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Best value in the settlement and not one person charging.", "n": "07"}, {"id": "mercantile_observer_crowd_08", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "I would rent out this exact spot by the hour.", "n": "08"}, {"id": "romantic_observer_alone_01", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Look at that. There is still something good left out here.", "n": "01"}, {"id": "romantic_observer_alone_02", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Somebody ought to be that glad to see me.", "n": "02"}, {"id": "romantic_observer_alone_03", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "It is very nearly enough to make a person hopeful.", "n": "03"}, {"id": "romantic_observer_alone_04", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "That is the first beautiful thing I have seen all week.", "n": "04"}, {"id": "romantic_observer_alone_05", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "I should look away, and I find I do not want to.", "n": "05"}, {"id": "romantic_observer_alone_06", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "The world ended and people still do that. Good.", "n": "06"}, {"id": "romantic_observer_alone_07", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "That makes me miss somebody I really should not.", "n": "07"}, {"id": "romantic_observer_alone_08", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "There are far worse things to stumble across out here.", "n": "08"}, {"id": "romantic_observer_crowd_01", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Say what you like, that is a lovely thing to see.", "n": "01"}, {"id": "romantic_observer_crowd_02", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Everybody is watching and nobody is laughing. That says something.", "n": "02"}, {"id": "romantic_observer_crowd_03", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Let them have it. There is little enough of that going around.", "n": "03"}, {"id": "romantic_observer_crowd_04", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "You can all stare if you want. I happen to think it is sweet.", "n": "04"}, {"id": "romantic_observer_crowd_05", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "That is the nicest thing to happen here in months.", "n": "05"}, {"id": "romantic_observer_crowd_06", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Put the word out, we have got romance in the settlement.", "n": "06"}, {"id": "romantic_observer_crowd_07", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "I would applaud, but that does seem like rather a lot.", "n": "07"}, {"id": "romantic_observer_crowd_08", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Look at this lot all pretending they are not watching.", "n": "08"}, {"id": "vulgar_observer_alone_01", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Well now. That is a hell of a way to spend an afternoon.", "n": "01"}, {"id": "vulgar_observer_alone_02", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Do not mind me. I am just going to stand right here.", "n": "02"}, {"id": "vulgar_observer_alone_03", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Somebody is having a considerably better day than I am.", "n": "03"}, {"id": "vulgar_observer_alone_04", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "alone", "t": "That is going to stay with me for quite a while.", "n": "04"}, {"id": "vulgar_observer_alone_05", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "alone", "t": "They are not even trying to be quiet about it.", "n": "05"}, {"id": "vulgar_observer_alone_06", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "alone", "t": "I have paid good caps for less of a show than this.", "n": "06"}, {"id": "vulgar_observer_alone_07", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Good for them. Filthy, but genuinely good for them.", "n": "07"}, {"id": "vulgar_observer_alone_08", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "alone", "t": "I would offer to join in, if I thought they would have me.", "n": "08"}, {"id": "vulgar_observer_crowd_01", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Is anybody else seeing this, or is it only me?", "n": "01"}, {"id": "vulgar_observer_crowd_02", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Go on then, do not stop on our account!", "n": "02"}, {"id": "vulgar_observer_crowd_03", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "That is the loudest thing here and I am including the generator.", "n": "03"}, {"id": "vulgar_observer_crowd_04", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "We are all watching. Nobody is pretending otherwise.", "n": "04"}, {"id": "vulgar_observer_crowd_05", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Somebody get them a room. Or do not. I am enjoying this.", "n": "05"}, {"id": "vulgar_observer_crowd_06", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Louder, would you! Some of us are standing at the back!", "n": "06"}, {"id": "vulgar_observer_crowd_07", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "That is going straight into the story I tell tonight.", "n": "07"}, {"id": "vulgar_observer_crowd_08", "p": "vulgar", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Half this crowd is taking notes, and I am one of them.", "n": "08"}, {"id": "reticent_observer_alone_01", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Oh. I should not be standing here right now.", "n": "01"}, {"id": "reticent_observer_alone_02", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "alone", "t": "I will simply pretend that I did not see any of that.", "n": "02"}, {"id": "reticent_observer_alone_03", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "alone", "t": "That is absolutely none of my business whatsoever.", "n": "03"}, {"id": "reticent_observer_alone_04", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "alone", "t": "I am going to go and look at literally anything else.", "n": "04"}, {"id": "reticent_observer_alone_05", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Well, that is me leaving. Right now. Immediately.", "n": "05"}, {"id": "reticent_observer_alone_06", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Nobody needs to know that I walked past just then.", "n": "06"}, {"id": "reticent_observer_alone_07", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "alone", "t": "I did not need to see that today, or on any other day.", "n": "07"}, {"id": "reticent_observer_alone_08", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "alone", "t": "I am going to go and be somewhere else entirely.", "n": "08"}, {"id": "reticent_observer_crowd_01", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Does nobody else find this all a bit much?", "n": "01"}, {"id": "reticent_observer_crowd_02", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "I would really rather we all looked somewhere else.", "n": "02"}, {"id": "reticent_observer_crowd_03", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Everyone is just going to stand here, are they.", "n": "03"}, {"id": "reticent_observer_crowd_04", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "This is the most uncomfortable I have been all year.", "n": "04"}, {"id": "reticent_observer_crowd_05", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Somebody say something. Or do not. I have no idea.", "n": "05"}, {"id": "reticent_observer_crowd_06", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "I am not staying to watch this with all of you.", "n": "06"}, {"id": "reticent_observer_crowd_07", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "We could all agree to walk away. Just a thought.", "n": "07"}, {"id": "reticent_observer_crowd_08", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Could we please not be doing this as a group.", "n": "08"}], PERS = ["mercantile", "romantic", "vulgar", "reticent"];
var a = new Audio(), cur = null, queue = [], qi = 0, mode = "persona", vt = TYPES[0];

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function play(b) {
  if (cur) { cur.classList.remove("playing"); }
  if (cur === b && !a.paused) { a.pause(); cur = null; return; }
  a.src = b.dataset.src; a.play(); b.classList.add("playing"); cur = b;
  qi = queue.indexOf(b);
}
a.onended = function () { if (cur) { cur.classList.remove("playing"); } cur = null; };

function btn(src, label, cls) {
  return "<button class=\"pb " + (cls || "") + "\" data-src=\"" + src + "\">" + label + "</button>";
}
function src(l) { return "play/" + vt.vt + "/" + l.id + ".wav"; }

function pick(f) { return LINES.filter(f); }

function byPersona() {
  var h = "";
  PERS.forEach(function (p) {
    h += "<h3>" + p + "</h3>";
    ["quickie", "athome", "tender"].forEach(function (s) {
      pick(function (l) { return l.p === p && l.k === "pair" && l.s === s; })
        .forEach(function (l, i) {
          h += "<div class=\"row\">" + btn(src(l), "&#9654;", p)
            + "<span class=\"rl\">" + (i === 0 ? s : (i === 6 ? "reply" : "")) + "</span>"
            + "<span class=\"tx\">" + esc(l.t) + "</span></div>";
        });
    });
    h += "<h3>" + p + " &mdash; watching someone else</h3>";
    ["alone", "crowd"].forEach(function (aud) {
      pick(function (l) { return l.p === p && l.k === "observer" && l.a === aud; })
        .forEach(function (l, i) {
          h += "<div class=\"row\">" + btn(src(l), "&#9654;", p)
            + "<span class=\"rl\">" + (i === 0 ? aud : "") + "</span>"
            + "<span class=\"tx\">" + esc(l.t)
            + (aud === "crowd" && i === 0 ? "<span class=\"loud\">PROJECTING VOICE</span>" : "")
            + "</span></div>";
        });
    });
  });
  return h;
}

function bySituation() {
  var h = "<p class=\"note\">Every block is ONE situation, with the four personas meeting it "
        + "in the same voice. That contrast is the whole mechanic - the same moment, four "
        + "different people.</p>";
  var groups = [], n;
  ["quickie", "athome", "tender"].forEach(function (s) {
    ["initiator", "responder"].forEach(function (r) {
      for (n = 1; n <= 6; n++) {
        groups.push({ label: s + " / " + r + " " + n, k: "pair", s: s, r: r,
                      n: ("0" + n).slice(-2) });
      }
    });
  });
  ["alone", "crowd"].forEach(function (aud) {
    for (n = 1; n <= 8; n++) {
      groups.push({ label: "watching / " + aud + " " + n, k: "observer", a: aud,
                    n: ("0" + n).slice(-2) });
    }
  });
  groups.forEach(function (g) {
    var set = PERS.map(function (p) {
      return pick(function (l) {
        return l.p === p && l.k === g.k && l.n === g.n
          && (g.k === "pair" ? (l.s === g.s && l.r === g.r) : l.a === g.a);
      })[0];
    }).filter(Boolean);
    if (set.length !== 4) { return; }
    h += "<div class=\"sit\"><div class=\"sitl\">" + g.label + "</div>";
    set.forEach(function (l) {
      h += "<div class=\"row\">" + btn(src(l), l.p.slice(0, 4), l.p)
        + "<span class=\"tx\">" + esc(l.t) + "</span></div>";
    });
    h += "</div>";
  });
  return h;
}

function render() {
  var m = document.getElementById("main");
  var h = "<h2>" + vt.vt + "</h2><div class=\"row\">";
  vt.van.forEach(function (v, i) { h += btn("vanilla/" + v, "vanilla " + (i + 1), "van"); });
  h += "</div>";
  m.innerHTML = h + (mode === "persona" ? byPersona() : bySituation());
  queue = [].slice.call(m.querySelectorAll(".pb"));
  queue.forEach(function (b) { b.onclick = function () { play(b); }; });
  m.scrollTop = 0;
}

function renderList(f) {
  var el = document.getElementById("list");
  el.innerHTML = "";
  TYPES.filter(function (t) {
    return !f || t.vt.toLowerCase().indexOf(f.toLowerCase()) >= 0;
  }).forEach(function (t) {
    var b = document.createElement("button");
    b.innerHTML = t.vt + "<small>" + t.n.toLocaleString() + " vanilla lines</small>";
    b.onclick = function () {
      document.querySelectorAll("#side button").forEach(function (x) {
        x.classList.remove("on"); });
      b.classList.add("on"); vt = t; render();
    };
    el.appendChild(b);
  });
}

document.querySelectorAll("#mode button").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll("#mode button").forEach(function (x) {
      x.classList.remove("on"); });
    b.classList.add("on"); mode = b.dataset.m; render();
  };
});
document.getElementById("q").oninput = function (e) { renderList(e.target.value); };
document.addEventListener("keydown", function (e) {
  if (e.code !== "Space" || e.target.tagName === "INPUT") { return; }
  e.preventDefault();
  if (!queue.length) { return; }
  qi = (qi + 1) % queue.length;
  queue[qi].click();
});

renderList("");
document.querySelector("#side button").classList.add("on");
render();
</script>
