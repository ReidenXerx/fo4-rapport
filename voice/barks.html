ndCity01-vanilla2.wav"], "ov": false}, {"vt": "MaleTriggerman01", "n": 621, "van": ["MaleTriggerman01-vanilla1.wav", "MaleTriggerman01-vanilla2.wav"], "ov": false}, {"vt": "MaleGhoulCombatant01", "n": 619, "van": ["MaleGhoulCombatant01-vanilla1.wav", "MaleGhoulCombatant01-vanilla2.wav"], "ov": false}, {"vt": "GuardMaleDiamondCity02", "n": 591, "van": ["GuardMaleDiamondCity02-vanilla1.wav", "GuardMaleDiamondCity02-vanilla2.wav"], "ov": false}, {"vt": "DLC03MaleMaineAccent", "n": 437, "van": ["DLC03MaleMaineAccent-vanilla1.wav", "DLC03MaleMaineAccent-vanilla2.wav"], "ov": false}, {"vt": "GuardMaleVault81", "n": 408, "van": ["GuardMaleVault81-vanilla1.wav", "GuardMaleVault81-vanilla2.wav"], "ov": false}, {"vt": "GuardFemaleVault81", "n": 408, "van": ["GuardFemaleVault81-vanilla1.wav", "GuardFemaleVault81-vanilla2.wav"], "ov": false}, {"vt": "DLC04GangPackFemale01", "n": 407, "van": ["DLC04GangPackFemale01-vanilla1.wav", "DLC04GangPackFemale01-vanilla2.wav"], "ov": false}, {"vt": "DLC04GangDiscipleMale01", "n": 375, "van": ["DLC04GangDiscipleMale01-vanilla1.wav", "DLC04GangDiscipleMale01-vanilla2.wav"], "ov": false}, {"vt": "DLC04GangOperatorFemale01", "n": 352, "van": ["DLC04GangOperatorFemale01-vanilla1.wav", "DLC04GangOperatorFemale01-vanilla2.wav"], "ov": false}, {"vt": "DLC04GangPackMale01", "n": 325, "van": ["DLC04GangPackMale01-vanilla1.wav", "DLC04GangPackMale01-vanilla2.wav"], "ov": false}, {"vt": "GunnersMale01", "n": 323, "van": ["GunnersMale01-vanilla1.wav", "GunnersMale01-vanilla2.wav"], "ov": false}, {"vt": "DLC03TrapperMale01", "n": 320, "van": ["DLC03TrapperMale01-vanilla1.wav", "DLC03TrapperMale01-vanilla2.wav"], "ov": false}, {"vt": "DLC04GangDiscipleFemale01", "n": 320, "van": ["DLC04GangDiscipleFemale01-vanilla1.wav", "DLC04GangDiscipleFemale01-vanilla2.wav"], "ov": false}, {"vt": "DLC04GangOperatorMale01", "n": 297, "van": ["DLC04GangOperatorMale01-vanilla1.wav", "DLC04GangOperatorMale01-vanilla2.wav"], "ov": false}], LINES = [{"id": "mercantile_quickie_init_01", "p": "mercantile", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "I've got five minutes and you're what I'm spending them on.", "n": "01"}, {"id": "mercantile_quickie_init_02", "p": "mercantile", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Name your price. Whatever it is, we settle up after.", "n": "02"}, {"id": "mercantile_quickie_init_03", "p": "mercantile", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Best offer you'll get all week, and it expires in about a minute.", "n": "03"}, {"id": "mercantile_quickie_init_04", "p": "mercantile", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "I'll owe you for this. You know I'm good for it.", "n": "04"}, {"id": "mercantile_quickie_init_05", "p": "mercantile", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Quick trade, and you won't regret the terms.", "n": "05"}, {"id": "mercantile_quickie_init_06", "p": "mercantile", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Everything here costs something. This is what I give away free.", "n": "06"}, {"id": "mercantile_quickie_resp_01", "p": "mercantile", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "Then you'd better make it worth the price.", "n": "01"}, {"id": "mercantile_quickie_resp_02", "p": "mercantile", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "I'll take that deal. Hurry up and close it.", "n": "02"}, {"id": "mercantile_quickie_resp_03", "p": "mercantile", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "You're good for it. Go on, then.", "n": "03"}, {"id": "mercantile_quickie_resp_04", "p": "mercantile", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "Terms accepted, so stop talking about them.", "n": "04"}, {"id": "mercantile_quickie_resp_05", "p": "mercantile", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "I want that in caps later. Right now just come here.", "n": "05"}, {"id": "mercantile_quickie_resp_06", "p": "mercantile", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "Cheap at twice the cost. Move.", "n": "06"}, {"id": "mercantile_athome_init_01", "p": "mercantile", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "Door's locked and the whole day is paid for. Come and collect.", "n": "01"}, {"id": "mercantile_athome_init_02", "p": "mercantile", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "I saved this one back for you. Everything else went on the counter.", "n": "02"}, {"id": "mercantile_athome_init_03", "p": "mercantile", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "I've been putting something aside all week, and it turns out it's you.", "n": "03"}, {"id": "mercantile_athome_init_04", "p": "mercantile", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "Whatever this costs me, I decided a while ago it was worth it.", "n": "04"}, {"id": "mercantile_athome_init_05", "p": "mercantile", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "Nobody's buying and nobody's selling tonight. There's only us.", "n": "05"}, {"id": "mercantile_athome_init_06", "p": "mercantile", "k": "pair", "s": "athome", "r": "initiator", "a": "", "t": "Take as long as you like. I'm not charging by the hour.", "n": "06"}, {"id": "mercantile_athome_resp_01", "p": "mercantile", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "Then I'm going to take my time with you.", "n": "01"}, {"id": "mercantile_athome_resp_02", "p": "mercantile", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "You always did know what a thing was worth.", "n": "02"}, {"id": "mercantile_athome_resp_03", "p": "mercantile", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "Keep that offer open all night and I'll keep saying yes.", "n": "03"}, {"id": "mercantile_athome_resp_04", "p": "mercantile", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "That's the first honest deal I've been offered in months.", "n": "04"}, {"id": "mercantile_athome_resp_05", "p": "mercantile", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "I'd have paid double for this. Don't tell anybody.", "n": "05"}, {"id": "mercantile_athome_resp_06", "p": "mercantile", "k": "pair", "s": "athome", "r": "responder", "a": "", "t": "Come here and collect, then.", "n": "06"}, {"id": "mercantile_tender_init_01", "p": "mercantile", "k": "pair", "s": "tender", "r": "initiator", "a": "", "t": "Out here nothing costs anything, and that's why I like it.", "n": "01"}, {"id": "mercantile_tender_init_02", "p": "mercantile", "k": "pair", "s": "tender", "r": "initiator", "a": "", "t": "I'd trade the whole stash for another hour of this.", "n": "02"}, {"id": "mercantile_tender_init_03", "p": "mercantile", "k": "pair", "s": "tender", "r": "initiator", "a": "", "t": "You're the only thing out here I'd call valuable.", "n": "03"}, {"id": "mercantile_tender_init_04", "p": "mercantile", "k": "pair", "s": "tender", "r": "initiator", "a": "", "t": "No caps and no counting tonight. Just stay a while.", "n": "04"}, {"id": "mercantile_tender_init_05", "p": "mercantile", "k": "pair", "s": "tender", "r": "initiator", "a": "", "t": "I've got nothing to offer you except this, and I'm offering it.", "n": "05"}, {"id": "mercantile_tender_init_06", "p": "mercantile", "k": "pair", "s": "tender", "r": "initiator", "a": "", "t": "Everything I own looks like junk next to you.", "n": "06"}, {"id": "mercantile_tender_resp_01", "p": "mercantile", "k": "pair", "s": "tender", "r": "responder", "a": "", "t": "Then keep it all. This is the part I wanted.", "n": "01"}, {"id": "mercantile_tender_resp_02", "p": "mercantile", "k": "pair", "s": "tender", "r": "responder", "a": "", "t": "You've got nothing left to trade and I'm still standing here.", "n": "02"}, {"id": "mercantile_tender_resp_03", "p": "mercantile", "k": "pair", "s": "tender", "r": "responder", "a": "", "t": "That's worth more than anything in your pack.", "n": "03"}, {"id": "mercantile_tender_resp_04", "p": "mercantile", "k": "pair", "s": "tender", "r": "responder", "a": "", "t": "I'd take this over caps on any day you care to name.", "n": "04"}, {"id": "mercantile_tender_resp_05", "p": "mercantile", "k": "pair", "s": "tender", "r": "responder", "a": "", "t": "Don't offer me anything. Just stay.", "n": "05"}, {"id": "mercantile_tender_resp_06", "p": "mercantile", "k": "pair", "s": "tender", "r": "responder", "a": "", "t": "Come closer. That's the whole price.", "n": "06"}, {"id": "romantic_quickie_init_01", "p": "romantic", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "I wanted to do this properly. I'll settle for doing it now.", "n": "01"}, {"id": "romantic_quickie_init_02", "p": "romantic", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "This deserves candles and a locked door, and it's getting neither.", "n": "02"}, {"id": "romantic_quickie_init_03", "p": "romantic", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Forgive the hurry. I've been thinking about you since morning.", "n": "03"}, {"id": "romantic_quickie_init_04", "p": "romantic", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Not how I pictured it, but it's still you, so it'll do.", "n": "04"}, {"id": "romantic_quickie_init_05", "p": "romantic", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "I'd make a speech about it if there were time, and there isn't.", "n": "05"}, {"id": "romantic_quickie_init_06", "p": "romantic", "k": "pair", "s": "quickie", "r": "initiator", "a": "", "t": "Come here before the whole moment gets away from us.", "n": "06"}, {"id": "romantic_quickie_resp_01", "p": "romantic", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "Save the speech for later and come here now.", "n": "01"}, {"id": "romantic_quickie_resp_02", "p": "romantic", "k": "pair", "s": "quickie", "r": "responder", "a": "", "t": "The moment is enough on its own. Take it.", "n": : "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Caps say they do not make it as far as the bed.", "n": "02"}, {"id": "mercantile_observer_crowd_03", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "If I had a stall right here I would retire by morning.", "n": "03"}, {"id": "mercantile_observer_crowd_04", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Admission is free today, apparently. Terrible business.", "n": "04"}, {"id": "mercantile_observer_crowd_05", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Taking bets, anyone? I rather like the odds.", "n": "05"}, {"id": "mercantile_observer_crowd_06", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "This crowd would pay. Somebody is leaving caps on the table.", "n": "06"}, {"id": "mercantile_observer_crowd_07", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Best value in the settlement and not one person charging.", "n": "07"}, {"id": "mercantile_observer_crowd_08", "p": "mercantile", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "I would rent out this exact spot by the hour.", "n": "08"}, {"id": "romantic_observer_alone_01", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Look at that. There is still something good left out here.", "n": "01"}, {"id": "romantic_observer_alone_02", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "Somebody ought to be that glad to see me.", "n": "02"}, {"id": "romantic_observer_alone_03", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "It is very nearly enough to make a person hopeful.", "n": "03"}, {"id": "romantic_observer_alone_04", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "That is the first beautiful thing I have seen all week.", "n": "04"}, {"id": "romantic_observer_alone_05", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "I should look away, and I find I do not want to.", "n": "05"}, {"id": "romantic_observer_alone_06", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "The world ended and people still do that. Good.", "n": "06"}, {"id": "romantic_observer_alone_07", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "That makes me miss somebody I really should not.", "n": "07"}, {"id": "romantic_observer_alone_08", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "alone", "t": "There are far worse things to stumble across out here.", "n": "08"}, {"id": "romantic_observer_crowd_01", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Say what you like, that is a lovely thing to see.", "n": "01"}, {"id": "romantic_observer_crowd_02", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Everybody is watching and nobody is laughing. That says something.", "n": "02"}, {"id": "romantic_observer_crowd_03", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Let them have it. There is little enough of that going around.", "n": "03"}, {"id": "romantic_observer_crowd_04", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "You can all stare if you want. I happen to think it is sweet.", "n": "04"}, {"id": "romantic_observer_crowd_05", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "That is the nicest thing to happen here in months.", "n": "05"}, {"id": "romantic_observer_crowd_06", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Put the word out, we have got romance in the settlement.", "n": "06"}, {"id": "romantic_observer_crowd_07", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "I would applaud, but that does seem like rather a lot.", "n": "07"}, {"id": "romantic_observer_crowd_08", "p": "romantic", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Look at this lot did not need to see that today, or on any other day.", "n": "07"}, {"id": "reticent_observer_alone_08", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "alone", "t": "I am going to go and be somewhere else entirely.", "n": "08"}, {"id": "reticent_observer_crowd_01", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Does nobody else find this all a bit much?", "n": "01"}, {"id": "reticent_observer_crowd_02", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "I would really rather we all looked somewhere else.", "n": "02"}, {"id": "reticent_observer_crowd_03", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Everyone is just going to stand here, are they.", "n": "03"}, {"id": "reticent_observer_crowd_04", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "This is the most uncomfortable I have been all year.", "n": "04"}, {"id": "reticent_observer_crowd_05", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Somebody say something. Or do not. I have no idea.", "n": "05"}, {"id": "reticent_observer_crowd_06", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "I am not staying to watch this with all of you.", "n": "06"}, {"id": "reticent_observer_crowd_07", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "We could all agree to walk away. Just a thought.", "n": "07"}, {"id": "reticent_observer_crowd_08", "p": "reticent", "k": "observer", "s": "", "r": "", "a": "crowd", "t": "Could we please not be doing this as a group.", "n": "08"}], PERS = ["mercantile", "romantic", "vulgar", "reticent"], OVER = [{"id": "ov_mercantile_greet_01", "p": "mercantile", "k": "greeting", "stage": 0, "reg": "", "o": "", "t": "Something you need, or are you just browsing?"}, {"id": "ov_mercantile_greet_02", "p": "mercantile", "k": "greeting", "stage": 0, "reg": "", "o": "", "t": "If you are buying, then I am listening."}, {"id": "ov_romantic_greet_01", "p": "romantic", "k": "greeting", "stage": 0, "reg": "", "o": "", "t": "Well now. Look who found their way over here."}, {"id": "ov_romantic_greet_02", "p": "romantic", "k": "greeting", "stage": 0, "reg": "", "o": "", "t": "I was hoping somebody interesting would walk past."}, {"id": "ov_vulgar_greet_01", "p": "vulgar", "k": "greeting", "stage": 0, "reg": "", "o": "", "t": "You want something, or do you just like the view?"}, {"id": "ov_vulgar_greet_02", "p": "vulgar", "k": "greeting", "stage": 0, "reg": "", "o": "", "t": "Come to talk, or come to do something about it?"}, {"id": "ov_reticent_greet_01", "p": "reticent", "k": "greeting", "stage": 0, "reg": "", "o": "", "t": "Oh. Hello. Did you need something from me?"}, {"id": "ov_reticent_greet_02", "p": "reticent", "k": "greeting", "stage": 0, "reg": "", "o": "", "t": "I did not see you standing there. Sorry."}, {"id": "ov_mercantile_offer_land_01", "p": "mercantile", "k": "response", "stage": 1, "reg": "offer", "o": "land", "t": "Now that is how you open a conversation."}, {"id": "ov_mercantile_offer_land_02", "p": "mercantile", "k": "response", "stage": 1, "reg": "offer", "o": "land", "t": "You have my attention, and that does not come cheap."}, {"id": "ov_mercantile_charm_miss_01", "p": "mercantile", "k": "response", "stage": 1, "reg": "charm", "o": "miss", "t": "Pretty words. What are they going to cost me?"}, {"id": "ov_mercantile_charm_miss_02", "p": "mercantile", "k": "response", "stage": 1, "reg": "charm", "o": "miss", "t": "That is very nice. Now tell me what you actually want."}, {"id": "ov_mercantile_blunt_miss_01", "p": "mercantile", "k": "response", "stage": 1, "reg": "blunt", "o": "miss", "t": "Direct. I respect it. I am still not moved."}, {"id": "ov_mercantile_blunt_miss_02", "p": "mercantile", "k": "response", "stage": 1, "reg": "blunt", "o": "miss", "t": "You could have led with an offer instead of that."}, {"id": "ov_mercantile_linger_miss_01", "p": "mercantile", "k": "response", rds."}, {"id": "ov2_mercantile_charm_miss_02", "p": "mercantile", "k": "response", "stage": 2, "reg": "charm", "o": "miss", "t": "You are very good at this. I am still waiting."}, {"id": "ov2_mercantile_blunt_miss_01", "p": "mercantile", "k": "response", "stage": 2, "reg": "blunt", "o": "miss", "t": "You could simply have made me an offer instead."}, {"id": "ov2_mercantile_blunt_miss_02", "p": "mercantile", "k": "response", "stage": 2, "reg": "blunt", "o": "miss", "t": "Blunt is cheap. Try something expensive."}, {"id": "ov2_mercantile_linger_miss_01", "p": "mercantile", "k": "response", "stage": 2, "reg": "linger", "o": "miss", "t": "Standing closer is not the same as offering me something."}, {"id": "ov2_mercantile_linger_miss_02", "p": "mercantile", "k": "response", "stage": 2, "reg": "linger", "o": "miss", "t": "You are taking up my whole afternoon for free."}, {"id": "ov2_romantic_offer_miss_01", "p": "romantic", "k": "response", "stage": 2, "reg": "offer", "o": "miss", "t": "More caps. Is that genuinely all you have got?"}, {"id": "ov2_romantic_offer_miss_02", "p": "romantic", "k": "response", "stage": 2, "reg": "offer", "o": "miss", "t": "You keep reaching for your pocket instead of your words."}, {"id": "ov2_romantic_charm_land_01", "p": "romantic", "k": "response", "stage": 2, "reg": "charm", "o": "land", "t": "Keep going. Nobody has said anything like that to me in years."}, {"id": "ov2_romantic_charm_land_02", "p": "romantic", "k": "response", "stage": 2, "reg": "charm", "o": "land", "t": "You are going to talk me into something, you know."}, {"id": "ov2_romantic_blunt_miss_01", "p": "romantic", "k": "response", "stage": 2, "reg": "blunt", "o": "miss", "t": "You were doing so well right up until you said that."}, {"id": "ov2_romantic_blunt_miss_02", "p": "romantic", "k": "response", "stage": 2, "reg": "blunt", "o": "miss", "t": "That was a step backwards and I think you know it."}, {"id": "ov2_romantic_linger_miss_01", "p": "romantic", "k": "response", "s     ["initiator", "responder"].forEach(function (r) {
      for (n = 1; n <= 6; n++) {
        groups.push({ label: s + " / " + r + " " + n, k: "pair", s: s, r: r,
                      n: ("0" + n).slice(-2) });
      }
    });
  });
  ["alone", "crowd"].forEach(function (aud) {
    for (n = 1; n <= 8; n++) {
      groups.push({ label: "watching / " + aud + " " + n, k: "observer", a: aud,
                    n: ("0" + n).slice(-2) });
    }
  });
  groups.forEach(function (g) {
    var set = PERS.map(function (p) {
      return pick(function (l) {
        return l.p === p && l.k === g.k && l.n === g.n
          && (g.k === "pair" ? (l.s === g.s && l.r === g.r) : l.a === g.a);
      })[0];
    }).filter(Boolean);
    if (set.length !== 4) { return; }
    h += "<div class=\"sit\"><div class=\"sitl\">" + g.label + "</div>";
    set.forEach(function (l) {
      h += "<div class=\"row\">" + btn(src(l), l.p.slice(0, 4), l.p)
        + "<span class=\"tx\">" + esc(l.t) + "</span></div>";
    });
    h += "</div>";
  });
  return h;
}

function overture() {
  if (!vt.ov) {
    return '<p class="note">Overture is voiced for the six core settler voices only '
      + '(MaleEvenToned, FemaleEvenToned, MaleBoston, FemaleBoston, MaleRough, '
      + 'FemaleRough). The other twenty-six are authored and waiting on next month '
      + 'credits - pick one of the six on the left.</p>';
  }
  var h = '<p class="note">The dialogue mod. The player picks a REGISTER; the NPC has a '
    + 'PERSONA; matching decides land or miss - and the player is never told which. '
    + 'An intimate register in a public room recoils even on the persona it would '
    + 'otherwise land with.</p>';
  var stages = [[0,'frame'],[1,'approach'],[2,'escalate'],[3,'propose']];
  stages.forEach(function (st) {
    h += '<h3>stage ' + st[0] + ' &mdash; ' + st[1] + '</h3>';
    PERS.forEach(function (p) {
      var set = OVER.filter(function (l) { return l.stage === st[0] && l.p === p; });
      if (!set.length) { return; }
      set.forEach(function (l, i) {
        var tag = l.o === 'land' ? 'LAND' : (l.o === 'recoil' ? 'RECOIL'
                : (l.o ? l.o.toUpperCase() : l.k));
        h += '<div class="row">' + btn('play/' + vt.vt + '/' + l.id + '.wav',
              p.slice(0, 4), p)
          + '<span class="rl">' + (i === 0 ? p : '') + '</span>'
          + '<span class="ov">' + (l.reg ? l.reg + ' ' : '') + tag + '</span>'
          + '<span class="tx">' + esc(l.t) + '</span></div>';
      });
    });
  });
  return h;
}

function render() {
  var m = document.getElementById("main");
  var h = "<h2>" + vt.vt + "</h2><div class=\"row\">";
  vt.van.forEach(function (v, i) { h += btn("vanilla/" + v, "vanilla " + (i + 1), "van"); });
  h += "</div>";
  m.innerHTML = h + (mode === "persona" ? byPersona()
                   : (mode === "situation" ? bySituation() : overture()));
  queue = [].slice.call(m.querySelectorAll(".pb"));
  queue.forEach(function (b) { b.onclick = function () { play(b); }; });
  m.scrollTop = 0;
}

function renderList(f) {
  var el = document.getElementById("list");
  el.innerHTML = "";
  TYPES.filter(function (t) {
    return !f || t.vt.toLowerCase().indexOf(f.toLowerCase()) >= 0;
  }).forEach(function (t) {
    var b = document.createElement("button");
    b.innerHTML = t.vt + "<small>" + t.n.toLocaleString() + " vanilla lines</small>";
    b.onclick = function () {
      document.querySelectorAll("#side button").forEach(function (x) {
        x.classList.remove("on"); });
      b.classList.add("on"); vt = t; render();
    };
    el.appendChild(b);
  });
}

document.querySelectorAll("#mode button").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll("#mode button").forEach(function (x) {
      x.classList.remove("on"); });
    b.classList.add("on"); mode = b.dataset.m; render();
  };
});
document.getElementById("q").oninput = function (e) { renderList(e.target.value); };
document.addEventListener("keydown", function (e) {
  if (e.code !== "Space" || e.target.tagName === "INPUT") { return; }
  e.preventDefault();
  if (!queue.length) { return; }
  qi = (qi + 1) % queue.length;
  queue[qi].click();
});

renderList("");
document.querySelector("#side button").classList.add("on");
render();
</script>
