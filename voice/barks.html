<!doctype html><meta charset="utf-8"><title>Rapport barks</title>
<style>
:root{--bg:#14120f;--fg:#e8e2d4;--dim:#8a8274;--acc:#c8a24a;--line:#2a2621;--van:#9ab87a}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,Segoe UI,sans-serif;
display:flex;flex-direction:column}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
h1{font-size:16px;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin:0}
.sub{color:var(--dim);font-size:12px}
#wrap{flex:1;display:flex;min-height:0}
#side{width:250px;border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0}
#side input{width:100%;background:#0e0c0a;border:0;border-bottom:1px solid var(--line);
color:var(--fg);padding:9px 14px;font:inherit;font-size:13px;position:sticky;top:0}
#side button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);
padding:8px 14px;cursor:pointer;font:inherit;font-size:13px;border-bottom:1px solid #1d1a16}
#side button:hover{background:#1b1813}
#side button.on{background:#241f19;color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
#side small{display:block;color:var(--dim);font-size:10.5px}
#main{flex:1;overflow-y:auto;padding:18px 24px}
.vhead{display:flex;gap:10px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.vhead h2{font-size:17px;margin:0;color:var(--acc)}
.brief{color:var(--dim);font-size:12px;margin:0 0 16px;max-width:760px}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
margin:20px 0 6px;border-bottom:1px solid var(--line);padding-bottom:5px}
.row{display:flex;gap:10px;align-items:center;padding:5px 0}
.pb{background:#241f19;color:var(--fg);border:1px solid var(--line);width:30px;height:30px;
border-radius:4px;cursor:pointer;flex-shrink:0;font-size:11px}
.pb:hover{border-color:var(--acc);color:var(--acc)}
.pb.playing{background:var(--acc);color:#14120f;border-color:var(--acc)}
.pb.van{border-color:#3a4a2a;color:var(--van)}.pb.van.playing{background:var(--van);color:#14120f}
.rl{color:var(--dim);font-size:10px;width:34px;flex-shrink:0;text-transform:uppercase;letter-spacing:.06em}
.md{font-size:9.5px;letter-spacing:.08em;width:20px;flex-shrink:0}
.md.v3{color:var(--van)}.md.v2{color:#6a6255}
.tx{flex:1}
.note{color:var(--dim);font-size:11.5px;margin:2px 0 0;font-style:italic}
kbd{background:#241f19;border:1px solid var(--line);border-radius:3px;padding:1px 5px;font-size:11px}
</style>
<header><h1>Rapport &mdash; barks</h1>
<span class="sub">32 voices &times; 36 lines &middot; every take transcribed and verified before it was written</span>
<span class="sub"><kbd>space</kbd> plays the next line</span></header>
<div id="wrap"><div id="side"><input id="q" placeholder="filter voices..."><div id="list"></div></div>
<div id="main"></div></div>
<script>
const TYPES=[{"vt": "MaleEvenToned", "n": 4085, "van": ["MaleEvenToned-vanilla1.wav", "MaleEvenToned-vanilla2.wav"]}, {"vt": "FemaleEvenToned", "n": 3428, "van": ["FemaleEvenToned-vanilla1.wav", "FemaleEvenToned-vanilla2.wav"]}, {"vt": "MaleRough", "n": 2880, "van": ["MaleRough-vanilla1.wav", "MaleRough-vanilla2.wav"]}, {"vt": "FemaleRough", "n": 2839, "van": ["FemaleRough-vanilla1.wav", "FemaleRough-vanilla2.wav"]}, {"vt": "MaleBoston", "n": 2822, "van": ["MaleBoston-vanilla1.wav", "MaleBoston-vanilla2.wav"]}, {"vt": "FemaleBoston", "n": 2418, "van": ["FemaleBoston-vanilla1.wav", "FemaleBoston-vanilla2.wav"]}, {"vt": "MaleGhoul", "n": 1604, "van": ["MaleGhoul-vanilla1.wav", "MaleGhoul-vanilla2.wav"]}, {"vt": "FemaleGhoul", "n": 1576, "van": ["FemaleGhoul-vanilla1.wav", "FemaleGhoul-vanilla2.wav"]}, {"vt": "MaleOld", "n": 1551, "van": ["MaleOld-vanilla1.wav", "MaleOld-vanilla2.wav"]}, {"vt": "FemaleOld", "n": 1464, "van": ["FemaleOld-vanilla1.wav", "FemaleOld-vanilla2.wav"]}, {"vt": "RaiderMale01", "n": 964, "van": ["RaiderMale01-vanilla1.wav", "RaiderMale01-vanilla2.wav"]}, {"vt": "RaiderMale02", "n": 944, "van": ["RaiderMale02-vanilla1.wav", "RaiderMale02-vanilla2.wav"]}, {"vt": "BoSFemale02", "n": 937, "van": ["BoSFemale02-vanilla1.wav", "BoSFemale02-vanilla2.wav"]}, {"vt": "BoSMale01", "n": 934, "van": ["BoSMale01-vanilla1.wav", "BoSMale01-vanilla2.wav"]}, {"vt": "BoSMale02", "n": 934, "van": ["BoSMale02-vanilla1.wav", "BoSMale02-vanilla2.wav"]}, {"vt": "BoSFemale01", "n": 927, "van": ["BoSFemale01-vanilla1.wav", "BoSFemale01-vanilla2.wav"]}, {"vt": "RaiderFemale01", "n": 795, "van": ["RaiderFemale01-vanilla1.wav", "RaiderFemale01-vanilla2.wav"]}, {"vt": "GuardMaleDiamondCity01", "n": 650, "van": ["GuardMaleDiamondCity01-vanilla1.wav", "GuardMaleDiamondCity01-vanilla2.wav"]}, {"vt": "MaleTriggerman01", "n": 621, "van": ["MaleTriggerman01-vanilla1.wav", "MaleTriggerman01-vanilla2.wav"]}, {"vt": "MaleGhoulCombatant01", "n": 619, "van": ["MaleGhoulCombatant01-vanilla1.wav", "MaleGhoulCombatant01-vanilla2.wav"]}, {"vt": "GuardMaleDiamondCity02", "n": 591, "van": ["GuardMaleDiamondCity02-vanilla1.wav", "GuardMaleDiamondCity02-vanilla2.wav"]}, {"vt": "DLC03MaleMaineAccent", "n": 437, "van": ["DLC03MaleMaineAccent-vanilla1.wav", "DLC03MaleMaineAccent-vanilla2.wav"]}, {"vt": "GuardMaleVault81", "n": 408, "van": ["GuardMaleVault81-vanilla1.wav", "GuardMaleVault81-vanilla2.wav"]}, {"vt": "GuardFemaleVault81", "n": 408, "van": ["GuardFemaleVault81-vanilla1.wav", "GuardFemaleVault81-vanilla2.wav"]}, {"vt": "DLC04GangPackFemale01", "n": 407, "van": ["DLC04GangPackFemale01-vanilla1.wav", "DLC04GangPackFemale01-vanilla2.wav"]}, {"vt": "DLC04GangDiscipleMale01", "n": 375, "van": ["DLC04GangDiscipleMale01-vanilla1.wav", "DLC04GangDiscipleMale01-vanilla2.wav"]}, {"vt": "DLC04GangOperatorFemale01", "n": 352, "van": ["DLC04GangOperatorFemale01-vanilla1.wav", "DLC04GangOperatorFemale01-vanilla2.wav"]}, {"vt": "DLC04GangPackMale01", "n": 325, "van": ["DLC04GangPackMale01-vanilla1.wav", "DLC04GangPackMale01-vanilla2.wav"]}, {"vt": "GunnersMale01", "n": 323, "van": ["GunnersMale01-vanilla1.wav", "GunnersMale01-vanilla2.wav"]}, {"vt": "DLC03TrapperMale01", "n": 320, "van": ["DLC03TrapperMale01-vanilla1.wav", "DLC03TrapperMale01-vanilla2.wav"]}, {"vt": "DLC04GangDiscipleFemale01", "n": 320, "van": ["DLC04GangDiscipleFemale01-vanilla1.wav", "DLC04GangDiscipleFemale01-vanilla2.wav"]}, {"vt": "DLC04GangOperatorMale01", "n": 297, "van": ["DLC04GangOperatorMale01-vanilla1.wav", "DLC04GangOperatorMale01-vanilla2.wav"]}], LINES=[{"id": "quickie_init_01", "sc": "quickie", "role": "initiator", "text": "We gotta make this quick.", "pref": "v3"}, {"id": "quickie_init_02", "sc": "quickie", "role": "initiator", "text": "Someone's gonna come through here any second.", "pref": "v3"}, {"id": "quickie_init_03", "sc": "quickie", "role": "initiator", "text": "Don't think about it. Just - here. Now.", "pref": "v3"}, {"id": "quickie_init_04", "sc": "quickie", "role": "initiator", "text": "Quick, before somebody needs something from me.", "pref": "v3"}, {"id": "quickie_init_05", "sc": "quickie", "role": "initiator", "text": "I've got about five minutes and I'm spending them on you.", "pref": "v3"}, {"id": "quickie_init_06", "sc": "quickie", "role": "initiator", "text": "Not here, somebody will see us. ...Fine. Here.", "pref": "v3"}, {"id": "quickie_resp_01", "sc": "quickie", "role": "responder", "text": "Then stop talking.", "pref": "v3"}, {"id": "quickie_resp_02", "sc": "quickie", "role": "responder", "text": "Fast, then. I mean it.", "pref": "v3"}, {"id": "quickie_resp_03", "sc": "quickie", "role": "responder", "text": "Let them look. I stopped caring a long time ago.", "pref": "v3"}, {"id": "quickie_resp_04", "sc": "quickie", "role": "responder", "text": "Five minutes. Use them.", "pref": "v3"}, {"id": "quickie_resp_05", "sc": "quickie", "role": "responder", "text": "Keep your voice down and I'm in.", "pref": "v2"}, {"id": "quickie_resp_06", "sc": "quickie", "role": "responder", "text": "Yeah. Yeah, I'm in.", "pref": "v3"}, {"id": "athome_init_01", "sc": "athome", "role": "initiator", "text": "Door's shut. Nobody needs us for a while.", "pref": "v3"}, {"id": "athome_init_02", "sc": "athome", "role": "initiator", "text": "Stay. Just for a while.", "pref": "v3"}, {"id": "athome_init_03", "sc": "athome", "role": "initiator", "text": "No one's coming. We've got all the time we want.", "pref": "v3"}, {"id": "athome_init_04", "sc": "athome", "role": "initiator", "text": "Come here. I've been thinking about this all day.", "pref": "v3"}, {"id": "athome_init_05", "sc": "athome", "role": "initiator", "text": "Let me look at you a second.", "pref": "v3"}, {"id": "athome_init_06", "sc": "athome", "role": "initiator", "text": "We're not going anywhere.", "pref": "v3"}, {"id": "athome_resp_01", "sc": "athome", "role": "responder", "text": "Good. I wasn't planning on leaving.", "pref": "v3"}, {"id": "athome_resp_02", "sc": "athome", "role": "responder", "text": "As long as you want.", "pref": "v3"}, {"id": "athome_resp_03", "sc": "athome", "role": "responder", "text": "Then take your time.", "pref": "v3"}, {"id": "athome_resp_04", "sc": "athome", "role": "responder", "text": "Lock the door, because I don't want to hear anybody.", "pref": "v2"}, {"id": "athome_resp_05", "sc": "athome", "role": "responder", "text": "I've been thinking about it too.", "pref": "v3"}, {"id": "athome_resp_06", "sc": "athome", "role": "responder", "text": "Come here, then.", "pref": "v3"}, {"id": "tender_init_01", "sc": "tender", "role": "initiator", "text": "Nobody out here but us.", "pref": "v3"}, {"id": "tender_init_02", "sc": "tender", "role": "initiator", "text": "Stay out here with me a while.", "pref": "v3"}, {"id": "tender_init_03", "sc": "tender", "role": "initiator", "text": "It's quiet. For once it's actually quiet.", "pref": "v2"}, {"id": "tender_init_04", "sc": "tender", "role": "initiator", "text": "Come here. Just - come here.", "pref": "v3"}, {"id": "tender_init_05", "sc": "tender", "role": "initiator", "text": "I'm not ready to go back inside yet.", "pref": "v3"}, {"id": "tender_init_06", "sc": "tender", "role": "initiator", "text": "Look at me. ...There you are.", "pref": "v3"}, {"id": "tender_resp_01", "sc": "tender", "role": "responder", "text": "It is quiet, isn't it.", "pref": "v3"}, {"id": "tender_resp_02", "sc": "tender", "role": "responder", "text": "I'm not going anywhere.", "pref": "v3"}, {"id": "tender_resp_03", "sc": "tender", "role": "responder", "text": "Then don't go back in.", "pref": "v3"}, {"id": "tender_resp_04", "sc": "tender", "role": "responder", "text": "Slow. Let's go slow.", "pref": "v3"}, {"id": "tender_resp_05", "sc": "tender", "role": "responder", "text": "...I like this. Being out here.", "pref": "v3"}, {"id": "tender_resp_06", "sc": "tender", "role": "responder", "text": "Come closer, then.", "pref": "v3"}];
const a=new Audio(); let cur=null, queue=[], qi=0;
function play(btn,src,q){
  if(cur)cur.classList.remove('playing');
  if(cur===btn&&!a.paused){a.pause();cur=null;return;}
  a.src=src;a.play().catch(()=>{});btn.classList.add('playing');cur=btn;
  if(q){queue=q.list;qi=q.i;}
}
a.onended=()=>{if(cur)cur.classList.remove('playing');cur=null;};
function renderList(f){
  const el=document.getElementById('list');el.innerHTML='';
  TYPES.filter(t=>!f||t.vt.toLowerCase().includes(f.toLowerCase())).forEach(t=>{
    const b=document.createElement('button');
    b.innerHTML=t.vt+'<small>'+t.n.toLocaleString()+' vanilla lines</small>';
    b.onclick=()=>show(t,b);el.appendChild(b);});
}
function show(t,btn){
  document.querySelectorAll('#side button').forEach(x=>x.classList.remove('on'));
  if(btn)btn.classList.add('on');
  const m=document.getElementById('main');
  let h='<div class="vhead"><h2>'+t.vt+'</h2>';
  t.van.forEach((v,i)=>h+='<button class="pb van" data-src="vanilla/'+v+'" title="Bethesda's real voice type">V'+(i+1)+'</button>');
  h+='</div><p class="brief">Green <b style="color:var(--van)">V</b> buttons are Bethesda&rsquo;s actual '
   +'voice type, for comparison. <b class="md v3">v3</b> marks lines that tried the expressive model '
   +'first (whisper tag, scenario pacing); <b class="md v2">v2</b> tried the plain one. '
   +'16 lines in the batch needed their second model &mdash; which ones is not recorded per file.</p>';
  ['quickie','athome','tender'].forEach(sc=>{
    h+='<h3>'+sc+'</h3>';
    ['initiator','responder'].forEach(role=>{
      LINES.filter(l=>l.sc===sc&&l.role===role).forEach((l,i)=>{
        h+='<div class="row"><button class="pb" data-src="play/'+t.vt+'/'+l.id+'.wav">&#9654;</button>'
         +'<span class="rl">'+(i===0?role.slice(0,4):'')+'</span>'
         +'<span class="md '+l.pref+'">'+l.pref+'</span>'
         +'<span class="tx">'+l.text.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span></div>';});});});
  m.innerHTML=h;m.scrollTop=0;
  const btns=[...m.querySelectorAll('.pb')];
  btns.forEach((b,i)=>b.onclick=()=>play(b,b.dataset.src,{list:btns,i:i}));
}
document.getElementById('q').oninput=e=>renderList(e.target.value);
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'||e.target.tagName==='INPUT')return;
  e.preventDefault();
  if(!queue.length)return;
  qi=(qi+1)%queue.length;queue[qi].click();});
renderList('');show(TYPES[0],document.querySelector('#side button'));
</script>
